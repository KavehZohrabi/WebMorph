name: npm release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Rust quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify tag and package versions
        run: node npm/scripts/check-versions.cjs "${GITHUB_REF_NAME}"
        if: github.event_name == 'push'
      - name: Verify package versions for dry run
        if: github.event_name == 'workflow_dispatch'
        run: node npm/scripts/check-versions.cjs
      - run: cargo fmt --check
      - run: cargo check --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build-platform:
    name: Build and test ${{ matrix.target }}
    needs: quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: win32-x64
            runner: windows-2025
          - target: win32-arm64
            runner: windows-11-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify package versions
        run: node npm/scripts/check-versions.cjs
      - name: Confirm native runner architecture
        run: node npm/scripts/check-runner.cjs ${{ matrix.target }}
      - name: Run platform tests
        run: cargo test --locked
      - name: Build optimized CLI
        run: cargo build --release --locked
      - name: Stage platform npm package
        run: node npm/scripts/stage-platform.cjs ${{ matrix.target }} target/release/webmorph${{ startsWith(matrix.target, 'win32-') && '.exe' || '' }} target/npm-platform
      - name: Pack platform package
        run: npm pack ./target/npm-platform --pack-destination target/npm-tarballs --json | node npm/scripts/verify-platform-pack.cjs ${{ matrix.target }} target/release/webmorph${{ startsWith(matrix.target, 'win32-') && '.exe' || '' }}
      - name: Upload platform package tarball
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.target }}
          path: target/npm-tarballs/*.tgz
          if-no-files-found: error

  package-main:
    name: Check main npm tarball
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node npm/scripts/check-versions.cjs
      - name: Test launcher selection and errors
        run: node --test test/launcher.test.cjs
      - name: Verify tarball contents
        run: npm pack --dry-run --json | node npm/scripts/verify-pack.cjs
      - name: Prepare npm tarball directory
        run: mkdir -p target/npm-tarballs
      - name: Upload main package tarball
        run: npm pack --pack-destination target/npm-tarballs
      - uses: actions/upload-artifact@v4
        with:
          name: main-npm-package
          path: target/npm-tarballs/*.tgz
          if-no-files-found: error

  release-authorized:
    name: Verify npm release authorization
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, build-platform, package-main]
    runs-on: ubuntu-24.04
    steps:
      - name: Require verified npm namespace and Trusted Publisher setup
        env:
          NPM_RELEASE_READY: ${{ vars.NPM_RELEASE_READY }}
        run: |
          if [ "$NPM_RELEASE_READY" != "true" ]; then
            echo "Release blocked: verify ownership of @kavehzohrabi, configure npm Trusted Publishers for all seven packages and this workflow/environment, then set repository variable NPM_RELEASE_READY=true." >&2
            exit 1
          fi

  publish:
    name: Publish platform packages, then main package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, build-platform, package-main, release-authorized]
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.5.1
      - name: Read npm version
        id: npm-version
        run: echo "version=$(npm --version)" >> "$GITHUB_OUTPUT"
      - name: Confirm npm CLI supports Trusted Publishing
        run: node -e "const [major,minor,patch]=process.env.NPM_VERSION.split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) { console.error('npm 11.5.1 or newer is required for Trusted Publishing'); process.exit(1) }"
        env:
          NPM_VERSION: ${{ steps.npm-version.outputs.version }}
      - name: Check registry versions before publishing
        run: node npm/scripts/preflight-release.cjs
      - uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          path: release-packages
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: main-npm-package
          path: release-packages
      - name: Publish all native packages
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          for package in linux-x64 linux-arm64 win32-x64 win32-arm64 darwin-x64 darwin-arm64; do
            archive="release-packages/kavehzohrabi-webmorph-${package}-${version}.tgz"
            if [ ! -f "$archive" ]; then
              echo "Missing required platform package archive: $archive" >&2
              exit 1
            fi
            npm publish "$archive" --access public --provenance
          done
      - name: Publish main npm package last
        run: |
          version="$(node -p "require('./package.json').version")"
          npm publish "release-packages/kavehzohrabi-webmorph-${version}.tgz" --access public --provenance
