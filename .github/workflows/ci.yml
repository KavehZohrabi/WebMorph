name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Check default build
        run: cargo check --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Generate local compatibility report
        run: cargo run --locked --bin compatibility-report -- --output target/compatibility-report.md
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.os }}
          path: target/compatibility-report.md
          if-no-files-found: warn

  chromium-runtime:
    name: Chromium runtime compatibility (Ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: browser-actions/setup-chrome@v1
      - name: Check optional browser backend
        run: cargo check --locked --features browser-engine
      - name: Test optional browser backend
        run: cargo test --locked --features browser-engine
      - name: Generate Chromium compatibility report
        run: cargo run --locked --features browser-engine --bin compatibility-report -- --output target/compatibility-report-chromium.md
      - name: Upload Chromium compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-chromium-ubuntu
          path: target/compatibility-report-chromium.md
          if-no-files-found: warn

  npm-cli:
    name: npm CLI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: win32-x64
            runner: windows-2025
          - target: win32-arm64
            runner: windows-11-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check version alignment
        run: node npm/scripts/check-versions.cjs
      - name: Confirm native runner architecture
        run: node npm/scripts/check-runner.cjs ${{ matrix.target }}
      - name: Build and test native CLI
        run: cargo test --locked && cargo build --release --locked
      - name: Stage platform package
        run: node npm/scripts/stage-platform.cjs ${{ matrix.target }} target/release/webmorph${{ startsWith(matrix.target, 'win32-') && '.exe' || '' }} target/npm-platform
      - name: Verify packed platform binary matches build
        run: npm pack ./target/npm-platform --pack-destination target/npm-tarballs --json | node npm/scripts/verify-platform-pack.cjs ${{ matrix.target }} target/release/webmorph${{ startsWith(matrix.target, 'win32-') && '.exe' || '' }}
      - name: Stage local native package for wrapper tests
        run: node npm/scripts/install-local-binary.cjs ${{ matrix.target }} target/release/webmorph${{ startsWith(matrix.target, 'win32-') && '.exe' || '' }}
      - name: Test npm launcher
        run: npm test
      - name: Verify npm package contents
        run: npm pack --dry-run --json | node npm/scripts/verify-pack.cjs
      - name: Smoke-test interactive TUI in a pseudo-terminal
        if: matrix.target == 'linux-x64'
        run: (sleep 2; printf '\021') | timeout 20s script -q -e -c 'node bin/webmorph.js --private http://127.0.0.1:1' /dev/null
