[package]
name = "webmorph"
version = "0.1.0"
edition = "2024"
description = "Transform websites into interactive terminal user interfaces"
license = "MIT"
readme = "README.md"

[features]
default = []
browser-engine = ["dep:chromiumoxide", "dep:tempfile", "dep:serde_json"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "stream"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
unicode-width = "0.2"
zeroize = "1.8"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
chromiumoxide = { version = "0.9.1", default-features = false, optional = true }
tempfile = { version = "3", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "pipeline"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
