[package]
name = "webmorph"
version = "0.1.0"
edition = "2024"
description = "Transform websites into interactive terminal user interfaces"
license = "MIT"
readme = "README.md"

[features]
default = []
browser-engine = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
